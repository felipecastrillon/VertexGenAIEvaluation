[project]
name = "vertexgenaieval"
version = "0.0.1"
description = "utility to run vertex GenAI eval tasks"
authors = [{name = "Felipe Castrillon", email = "felipecastrillon87@gmail.com"}]
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE.txt"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=1.3.5",
    "google-cloud>=0.34.0",
    "google-cloud-aiplatform>=1.28.1",
    "nltk>=3.8.1",
    "numpy>=1.21.6",
    "scikit-learn>=1.0.2",
    "vertexai>=0.0.1",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
